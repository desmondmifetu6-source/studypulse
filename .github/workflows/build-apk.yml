name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger anytime via GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Offline Web Assets for APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp styles.css android/app/src/main/assets/www/
          cp app.js android/app/src/main/assets/www/
          cp manifest.json android/app/src/main/assets/www/
          cp icon.svg android/app/src/main/assets/www/
          ls -la android/app/src/main/assets/www/

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Standalone Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPulse-GH-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
